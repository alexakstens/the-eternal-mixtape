name: Pamplejuce

on:
  workflow_dispatch: # lets you run a build from the UI
  push:
  pull_request:

# When pushing new commits, cancel any running builds on that branch
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  DISPLAY: :0 # linux pluginval needs this
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1
  SCCACHE_IDLE_TIMEOUT: 0
  ORT_VERSION: "1.23.0"
  ONNXRUNTIME_ROOT: ""  # set at runtime by the ORT download steps below

defaults:
  run:
    shell: bash

# jobs are run in parallel on different machines
# all steps run in series
jobs:
  build_and_test:
    # don't double run on PRs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # show all errors for each platform (vs. cancel jobs on error)
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            extra-flags: -G Ninja
            ort-pkg: onnxruntime-linux-x64
            ort-ext: tgz
            ort-use-gpu: "OFF"
          - name: macOS
            os: macos-14
            extra-flags: -G Ninja
            ort-pkg: onnxruntime-osx-arm64
            ort-ext: tgz
            ort-use-gpu: "ON"
          - name: Windows-CPU
            os: windows-latest
            ort-pkg: onnxruntime-win-x64
            ort-ext: zip
            ort-use-gpu: "OFF"
          - name: Windows-GPU
            os: windows-latest
            ort-nuget: Microsoft.ML.OnnxRuntime.DirectML
            ort-use-gpu: "ON"

    steps:
      # Setup MSVC toolchain and developer command prompt (Windows)
      - uses: ilammy/msvc-dev-cmd@v1

      # Use clang on Linux so we don't introduce a 3rd compiler (Windows and macOS use MSVC and Clang)
      - name: Set up Clang
        if: runner.os == 'Linux'
        uses: egor-tensin/setup-clang@v1

      # This also starts up our "fake" display (Xvfb), needed for pluginval
      - name: Install JUCE's Linux Deps
        if: runner.os == 'Linux'
        # Thanks to McMartin & co https://forum.juce.com/t/list-of-juce-dependencies-under-linux/15121/44
        run: |
          # IPP stuff
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          
          sudo apt-get update && sudo apt install libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype6-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev xvfb ninja-build intel-oneapi-ipp-devel
          sudo /usr/bin/Xvfb $DISPLAY & 

      - name: Install IPP (Windows)
        if: (runner.os == 'Windows')
        run: |
          nuget install intelipp.static.win-x64 -Version 2022.3.0.387

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install macOS Deps
        if: ${{ runner.os == 'macOS' }}
        run: brew install ninja osxutils

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Cache the build
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Download ONNX Runtime (archive — Linux, macOS, Windows CPU)
        if: matrix.ort-pkg != ''
        run: |
          PKG="${{ matrix.ort-pkg }}-${{ env.ORT_VERSION }}"
          curl -fL "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ORT_VERSION }}/${PKG}.${{ matrix.ort-ext }}" -o ort-archive
          if [[ "${{ matrix.ort-ext }}" == "zip" ]]; then
            7z x ort-archive -o.
          else
            tar -xzf ort-archive
          fi
          echo "ONNXRUNTIME_ROOT=${{ github.workspace }}/${PKG}" >> "$GITHUB_ENV"

      - name: Download ONNX Runtime (NuGet — Windows GPU)
        if: runner.os == 'Windows' && matrix.ort-use-gpu == 'ON'
        run: |
          nuget install "${{ matrix.ort-nuget }}" -Version "${{ env.ORT_VERSION }}" -NonInteractive
          echo "ONNXRUNTIME_ROOT=${{ github.workspace }}/${{ matrix.ort-nuget }}.${{ env.ORT_VERSION }}" >> "$GITHUB_ENV"

      # The GitHub Windows runner ships ORT 1.17.x system-wide. Adding our DLL directory
      # to PATH ensures the correct version is loaded when CatchAddTests and ctest run executables.
      - name: Add ORT DLLs to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          if [[ "${{ matrix.ort-use-gpu }}" == "ON" ]]; then
            echo "${{ env.ONNXRUNTIME_ROOT }}/runtimes/win-x64/native" >> "$GITHUB_PATH"
          else
            echo "${{ env.ONNXRUNTIME_ROOT }}/lib" >> "$GITHUB_PATH"
          fi

      - name: Configure
        run: cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DONNXRUNTIME_ROOT="${{ env.ONNXRUNTIME_ROOT }}" -DORT_USE_GPU=${{ matrix.ort-use-gpu }} -DDISCOVERY_MODE=DISCOVERY_MODE ${{ matrix.extra-flags }} .

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Test & Benchmarks
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --verbose --output-on-failure

      - name: Read in .env from CMake # see GitHubENV.cmake
        run: |
          cat .env # show us the config
          cat .env >> $GITHUB_ENV # pull in our PRODUCT_NAME, etc

      - name: Set additional env vars for next steps
        run: |
          ARTIFACTS_PATH=${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}_artefacts/${{ env.BUILD_TYPE }}
          echo "ARTIFACTS_PATH=$ARTIFACTS_PATH" >> $GITHUB_ENV
          echo "STANDALONE_DIR=$ARTIFACTS_PATH/Standalone" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${{ env.PRODUCT_NAME }}-${{ env.VERSION }}-${{ matrix.name }}" >> $GITHUB_ENV

      - name: Copy model to output directory
        run: |
          if [[ "${{ matrix.ort-use-gpu }}" == "ON" ]]; then
            MODEL=models/htdemucs.onnx
          else
            MODEL=models/htdemucs_cpu.onnx
          fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            DEST="$STANDALONE_DIR/$PRODUCT_NAME.app/Contents/Resources/models"
          else
            DEST="$STANDALONE_DIR/models"
          fi
          mkdir -p "$DEST"
          cp "$MODEL" "$DEST/"

      - name: Import Certificates (macOS)
        uses: sudara/basic-macos-keychain-action@v1
        id: keychain
        if: ${{ runner.os == 'macOS'}}
        with:
          dev-id-app-cert: ${{ secrets.DEV_ID_APP_CERT }}
          dev-id-app-password: ${{ secrets.DEV_ID_APP_PASSWORD }}
          dev-id-installer-cert: ${{ secrets.DEV_ID_INSTALLER_CERT }}
          dev-id-installer-password: ${{ secrets.DEV_ID_INSTALLER_PASSWORD }}

      - name: Codesign (macOS)
        if: ${{ runner.os == 'macOS' && 1 == 0 }} # disabled — not in v0.1 scope
        timeout-minutes: 5
        run: |
          codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.STANDALONE_DIR }}/${{ env.PRODUCT_NAME }}.app" --deep --strict --options=runtime --timestamp

      - name: pkgbuild, Productbuild and Notarize
        if: ${{ runner.os == 'macOS' && 1 == 0}} #disable code sign
        timeout-minutes: 5
        run: |
          pkgbuild --identifier "${{ env.BUNDLE_ID }}.au.pkg" --version $VERSION --component "${{ env.AU_PATH }}" --install-location "/Library/Audio/Plug-Ins/Components"  "packaging/${{ env.PRODUCT_NAME }}.au.pkg"
          pkgbuild --identifier "${{ env.BUNDLE_ID }}.vst3.pkg" --version $VERSION --component "${{ env.VST3_PATH }}" --install-location "/Library/Audio/Plug-Ins/VST3" "packaging/${{ env.PRODUCT_NAME }}.vst3.pkg"
          pkgbuild --identifier "${{ env.BUNDLE_ID }}.clap.pkg" --version $VERSION --component "${{ env.CLAP_PATH }}" --install-location "/Library/Audio/Plug-Ins/CLAP" "packaging/${{ env.PRODUCT_NAME }}.clap.pkg"

          # Standalone is special, needs a boolean to always install in /Applications
          pkgbuild --analyze --root "$(dirname "${{ env.STANDALONE_PATH }}")" standalone.plist
          plutil -replace BundleIsRelocatable -bool NO standalone.plist
          pkgbuild --identifier "${{ env.BUNDLE_ID }}.app.pkg" --version $VERSION --root "$(dirname "${{ env.STANDALONE_PATH }}")" --component-plist standalone.plist --install-location "/Applications" "packaging/${{ env.PRODUCT_NAME }}.app.pkg"

          cd packaging
          envsubst < distribution.xml.template > distribution.xml
          productbuild --resources ./resources --distribution distribution.xml --sign "${{ secrets.DEVELOPER_ID_INSTALLER }}" --timestamp "${{ env.ARTIFACT_NAME }}.pkg"

          xcrun notarytool submit "${{ env.ARTIFACT_NAME }}.pkg" --apple-id ${{ secrets.NOTARIZATION_USERNAME }} --password ${{ secrets.NOTARIZATION_PASSWORD }} --team-id ${{ secrets.TEAM_ID }} --wait
          xcrun stapler staple "${{ env.ARTIFACT_NAME }}.pkg"

      - name: Zip (Windows)
        if: ${{ runner.os == 'Windows' }}
        working-directory: ${{ env.STANDALONE_DIR }}
        run: 7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" .

      - name: Zip (macOS)
        if: ${{ runner.os == 'macOS' }}
        working-directory: ${{ env.STANDALONE_DIR }}
        run: 7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" "${{ env.PRODUCT_NAME }}.app"

      - name: Zip (Linux)
        if: ${{ runner.os == 'Linux' }}
        working-directory: ${{ env.STANDALONE_DIR }}
        run: 7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" .

      - name: Codesign with Azure Trusted Signing
        if: ${{ runner.os == 'Windows' && 1 == 0 }} # disabled — not in v0.1 scope
        uses: azure/trusted-signing-action@v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ env.STANDALONE_DIR }}
          files-folder-filter: exe

      - name: Upload Zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}.zip
          path: "${{ env.STANDALONE_DIR }}/${{ env.ARTIFACT_NAME }}.zip"

  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          # download-artifact puts these files in their own dirs...
          # Using globs sidesteps having to pass the version around
          files: |
            */*.exe
            */*.zip
            */*.dmg
